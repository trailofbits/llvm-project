name: Fork LLVM and Clang Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [enforced_secrecy_main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zeroization-verifier:
    name: AArch64 zeroization verifier (expensive checks)
    if: >-
      github.repository == 'trailofbits/llvm-project' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: |
            cmake
            llvm
            libc
            third-party

      - name: Configure and build the verifier
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld cmake ninja-build
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_EXPENSIVE_CHECKS=ON \
            -DLLVM_ENABLE_LLD=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1
          cmake --build build --parallel "$(nproc)" --target llvm-test-depends

      - name: Check final register and flag values
        run: |
          set -euo pipefail
          build/bin/llvm-lit -sv \
            llvm/test/CodeGen/AArch64/zero-call-used-regs.ll \
            llvm/test/CodeGen/AArch64/zeroize-flags.ll \
            llvm/test/CodeGen/AArch64/zeroize-signed-spill-catch.ll \
            llvm/test/CodeGen/AArch64/verify-zeroize-flags.mir \
            llvm/test/CodeGen/AArch64/verify-zeroized-registers.mir \
            llvm/test/CodeGen/AArch64/verify-zeroized-upper-lanes.mir \
            llvm/test/CodeGen/AArch64/verify-zeroized-scs-resume.mir

  llvm-clang:
    name: LLVM and Clang (Linux, all targets)
    if: >-
      github.repository == 'trailofbits/llvm-project' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: |
            .ci
            cmake
            llvm
            clang
            libc
            third-party

      - name: Test the zeroization gates
        run: |
          set -euo pipefail
          python3 .ci/check_zeroization_compatibility_test.py
          python3 .ci/check_zeroization_ffr_test.py
          python3 .ci/check_zeroization_aarch64_cleanup_test.py

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang lld cmake ninja-build python3 python3-psutil python3-yaml \
            qemu-user g++-aarch64-linux-gnu

      - name: Configure
        env:
          LLVM_LIT_ARGS: >-
            -v --timeout=1200 --use-unique-output-file-name
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=all \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_LLD=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_LIT_ARGS="${LLVM_LIT_ARGS} --xunit-xml-output=${PWD}/build/test-results.xml" \
            2>&1 | tee artifacts/configure.log

      - name: Check frozen register-zeroing compatibility
        run: |
          set -euo pipefail
          cmake --build build --parallel "$(nproc)" \
            --target llvm-test-depends clang-test-depends \
            2>&1 | tee artifacts/compatibility-build.log
          python3 .ci/check_zeroization_compatibility.py \
            --build-dir build --report artifacts/zeroization-compatibility.json \
            2>&1 | tee artifacts/compatibility.log

      - name: Run the x86-64 protected C++ cleanups
        run: |
          set -euo pipefail
          tests=clang/test/CodeGenCXX
          for case in escaping mixed; do
            build/bin/clang --driver-mode=g++ -O2 -msahf -fexceptions -DPROTECTED \
              -Werror -mllvm -verify-machineinstrs \
              "$tests/zeroize-on-return-${case}-cleanup.cpp" \
              "$tests/Inputs/zeroize-on-return-${case}-cleanup-driver.cpp" \
              -o build/zeroize-cleanup
            build/zeroize-cleanup
          done

      - name: Observe native x86-64 residue
        run: |
          set -euo pipefail
          bash .ci/check_zeroization_residue.sh \
            "$PWD/build/bin/clang" artifacts/residue

      - name: Observe AArch64 SVE first-fault register state
        run: |
          set -euo pipefail
          python3 .ci/check_zeroization_ffr.py \
            --llc "$PWD/build/bin/llc" --clang "$PWD/build/bin/clang" \
            --linker /usr/bin/ld.lld --qemu /usr/bin/qemu-aarch64 \
            --output artifacts/sve-ffr 2>&1 | tee artifacts/sve-ffr.log

      - name: Observe AArch64 C++ cleanup state
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 .ci/check_zeroization_aarch64_cleanup.py \
            --clang "$PWD/build/bin/clang" --cxx /usr/bin/aarch64-linux-gnu-g++ \
            --qemu /usr/bin/qemu-aarch64 --sysroot / \
            --source-revision "$(git rev-parse HEAD)" \
            --output artifacts/aarch64-cleanup 2>&1 | tee artifacts/aarch64-cleanup.log

      - name: Build and run full test suites
        run: |
          set -euo pipefail
          cmake --build build --parallel "$(nproc)" \
            --target check-llvm check-clang check-clang-python -- -k 0 \
            2>&1 | tee artifacts/tests.log

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-llvm-clang-results
          path: |
            artifacts/
            build/test-results*.xml
          retention-days: 5
